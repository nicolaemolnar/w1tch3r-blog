<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // SPA redirect for GitHub Pages
      const l = window.location;
      const repo = "/w1tch3r-blog"; // <-- cambia si tu repo se llama distinto
      const path = l.pathname.startsWith(repo) ? l.pathname.slice(repo.length) : l.pathname;
      const newUrl = repo + "/?p=" + encodeURIComponent(path + l.search + l.hash);
      l.replace(newUrl);
    </script>
  </head>
  <body></body>
</html>
